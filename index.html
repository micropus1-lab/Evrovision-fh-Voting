

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Junior Eurovision</title>

<style>

* { box-sizing: border-box; }

:root {

  --pink: #ff35d3;

  --purple: #a52cff;

  --text: #ffffff;

}

body {

  margin: 0;

  padding: 18px;

  min-height: 100vh;

  color: var(--text);

  font-family: Arial, sans-serif;

  background:

    linear-gradient(rgba(28,0,42,.55),rgba(35,0,55,.65)),

    url("09FC985A-65F0-4B71-B56A-2402266E9249.png");

  background-size: cover;

  background-position: center;

  background-attachment: fixed;

}

.container {

  max-width: 650px;

  margin: 25px auto;

  padding: 25px;

  background: rgba(24,5,39,.88);

  border: 1px solid rgba(225,87,255,.65);

  border-radius: 23px;

  box-shadow: 0 0 25px rgba(193,40,255,.22);

  backdrop-filter: blur(14px);

}

.header {

  text-align: center;

  padding: 12px 0 22px;

}

.logo {

  font-size: clamp(30px,7vw,43px);

  font-weight: 900;

  letter-spacing: 2px;

  background: linear-gradient(90deg,#ff72e8,#c48aff,#ff48d7);

  -webkit-background-clip: text;

  background-clip: text;

  color: transparent;

  filter: drop-shadow(0 0 12px rgba(255,55,220,.7));

}

.subtitle {

  color: #e6b8ff;

  letter-spacing: 2px;

  font-size: 12px;

  margin-top: 10px;

  text-align: center;

}

h2 {

  color: #f5a5ff;

  text-align: center;

  font-size: 21px;

  margin: 22px 0;

}

.small {

  color: #d5b8e7;

  font-size: 13px;

  text-align: center;

  line-height: 1.6;

}

#scoreFields {

  display: grid;

  gap: 13px;

}

.country {

  padding: 15px;

  border: 1px solid rgba(204,93,255,.48);

  border-radius: 15px;

  background: linear-gradient(

    120deg,

    rgba(114,35,160,.28),

    rgba(255,44,203,.10)

  );

  transition: .25s;

}

.country:focus-within {

  border-color: #ff57df;

  box-shadow: 0 0 15px rgba(255,49,213,.35);

}

.country label {

  display: block;

  color: #ff9aeb;

  font-weight: bold;

  font-size: 16px;

  margin-bottom: 9px;

}

select,input {

  width: 100%;

  padding: 14px;

  color: white;

  background: rgba(32,10,50,.95);

  border: 1px solid rgba(208,113,255,.55);

  border-radius: 11px;

  font-size: 15px;

  outline: none;

}

select option {

  background: #260b39;

  color: white;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 13px;

  border: 1px solid rgba(255,255,255,.16);

  border-radius: 12px;

  background: linear-gradient(100deg,#a62be5,#f12ab9);

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  transition: .25s;

  box-shadow: 0 0 15px rgba(220,46,240,.25);

}

button:hover {

  filter: brightness(1.16);

  box-shadow: 0 0 22px rgba(255,55,220,.5);

}

button:disabled {

  opacity: .5;

  cursor: not-allowed;

}

.message {

  text-align: center;

  color: #ff9eea;

  margin-top: 15px;

  line-height: 1.5;

  overflow-wrap: anywhere;

}

.admin-box {

  margin-top: 35px;

  padding-top: 20px;

  border-top: 1px solid rgba(220,110,255,.35);

}

.admin-card {

  padding: 17px;

  border-radius: 15px;

  background: rgba(45,12,65,.75);

  border: 1px solid rgba(185,95,255,.4);

}

.secondary {

  background: linear-gradient(100deg,#6630a9,#a63acb);

}

.danger {

  background: linear-gradient(100deg,#a3226e,#e02e80);

}

.result {

  padding: 13px;

  margin: 9px 0;

  border-radius: 11px;

  background: rgba(119,39,153,.23);

  border: 1px solid rgba(205,102,255,.3);

  color: #f8dfff;

  overflow-wrap: anywhere;

}

.hidden {

  display: none !important;

}

.footer {

  text-align: center;

  color: rgba(231,186,255,.6);

  font-size: 11px;

  margin-top: 25px;

  letter-spacing: 2px;

}

@media(max-width:480px) {

  body {

    padding: 9px;

    background-attachment: scroll;

  }

  .container {

    padding: 17px;

    margin: 12px auto;

  }

  .country {

    padding: 12px;

  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">JUNIOR EUROVISION</div>

    <p class="subtitle">OFFICIAL VOTING</p>

  </div>

  <div id="voting">

    <h2>Голосование</h2>

    <p class="small">

      Распределите баллы между шестью разными странами

    </p>

    <div id="scoreFields"></div>

    <button id="voteButton" onclick="submitVote()">

      ОТПРАВИТЬ ГОЛОСА

    </button>

    <p id="voteMessage" class="message"></p>

  </div>

  <div class="admin-box">

    <h2>Администрация</h2>

    <div id="loginBox" class="admin-card">

      <input id="adminEmail"

        type="email"

        placeholder="Почта администратора">

      <button onclick="loginAdmin()">

        ВОЙТИ В АДМИН-ПАНЕЛЬ

      </button>

      <p id="loginMessage" class="message"></p>

    </div>

    <div id="adminPanel" class="hidden">

      <div class="admin-card">

        <h2>Панель администратора</h2>

        <p id="roundInfo" class="message"></p>

        <button class="secondary" onclick="loadResults()">

          ОБНОВИТЬ РЕЗУЛЬТАТЫ

        </button>

        <h2>Таблица результатов</h2>

        <div id="results"></div>

        <h2>Подробности голосования</h2>

        <div id="details"></div>

        <button class="danger" onclick="resetVoting()">

          СБРОСИТЬ ГОЛОСОВАНИЕ

        </button>

        <button class="secondary" onclick="logoutAdmin()">

          ВЫЙТИ ИЗ АДМИН-ПАНЕЛИ

        </button>

      </div>

    </div>

  </div>

  <div class="footer">

    JUNIOR EUROVISION • OFFICIAL VOTING

  </div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {

  getAuth,

  sendSignInLinkToEmail,

  isSignInWithEmailLink,

  signInWithEmailLink,

  signOut,

  onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {

  getFirestore,

  collection,

  setDoc,

  getDocs,

  doc,

  getDoc,

  setDoc as saveDoc,

  serverTimestamp,

  writeBatch

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyC8SKJZIDbNuo3nmZK_3bpUbWpCuWEa0Xg",

  authDomain: "eurovision-fh-voting-a8f25.firebaseapp.com",

  projectId: "eurovision-fh-voting-a8f25",

  storageBucket: "eurovision-fh-voting-a8f25.firebasestorage.app",

  messagingSenderId: "429725643873",

  appId: "1:429725643873:web:5305437fd2d799ccd06620",

  measurementId: "G-42HFQK5DH8"

};

const ADMIN_EMAIL = "micropus1@gmail.com";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const countries = [

  "Armenia 🇦🇲",

  "France 🇫🇷",

  "United Kingdom 🇬🇧",

  "Italy 🇮🇹",

  "Cyprus 🇨🇾",

  "Poland 🇵🇱",

  "Russia 🇷🇺",

  "Ukraine 🇺🇦"

];

const points = [2,4,6,8,10,12];

let currentRound = 1;

let adminUser = null;

function createScoreFields() {

  const container = document.getElementById("scoreFields");

  container.innerHTML = "";

  points.forEach(point => {

    const div = document.createElement("div");

    div.className = "country";

    const label = document.createElement("label");

    label.textContent = point + " БАЛЛОВ";

    const select = document.createElement("select");

    select.id = "score" + point;

    const placeholder = document.createElement("option");

    placeholder.value = "";

    placeholder.textContent = "Выберите страну";

    select.appendChild(placeholder);

    countries.forEach(country => {

      const option = document.createElement("option");

      option.value = country;

      option.textContent = country;

      select.appendChild(option);

    });

    div.appendChild(label);

    div.appendChild(select);

    container.appendChild(div);

  });

}

createScoreFields();

async function getRound() {

  const ref = doc(db,"settings","voting");

  const snapshot = await getDoc(ref);

  currentRound = snapshot.exists()

    ? (snapshot.data().round || 1)

    : 1;

  return currentRound;

}

// ОТПРАВКА ГОЛОСОВ

window.submitVote = async function() {

  const message = document.getElementById("voteMessage");

  const button = document.getElementById("voteButton");

  if (button.disabled) return;

  button.disabled = true;

  button.textContent = "ОТПРАВКА...";

  try {

    message.textContent = "Проверяем голосование...";

    await getRound();

    const voterKey = "juniorEurovisionVoterId";

    let voterId = localStorage.getItem(voterKey);

    if (!voterId) {

      if (!crypto.randomUUID) {

        throw new Error("Обновите браузер для голосования");

      }

      voterId = crypto.randomUUID();

      localStorage.setItem(voterKey,voterId);

    }

    const votedKey = "juniorEurovisionVotedRound";

    const votedRound = localStorage.getItem(votedKey);

    if (votedRound === String(currentRound)) {

      message.textContent = "Вы уже проголосовали в этом туре!";

      return;

    }

    const scores = {};

    const selected = [];

    for (const point of points) {

      const select = document.getElementById("score" + point);

      const country = select?.value;

      if (!country) {

        message.textContent = "Распределите все баллы!";

        return;

      }

      if (selected.includes(country)) {

        message.textContent = "Нельзя выбирать одну страну дважды!";

        return;

      }

      selected.push(country);

      scores[String(point)] = country;

    }

    message.textContent = "Сохраняем ваши голоса...";

    const voteId = voterId + "_" + currentRound;

    await setDoc(doc(db,"votes",voteId), {

      scores,

      round: currentRound,

      voterId,

      createdAt: serverTimestamp()

    });

    localStorage.setItem(votedKey,String(currentRound));

    message.textContent = "Ваши голоса успешно отправлены!";

    points.forEach(point => {

      document.getElementById("score" + point).value = "";

    });

  } catch(error) {

    console.error("Ошибка голосования:",error);

    if (error.code === "permission-denied") {

      message.textContent =

        "Доступ запрещён Firebase. Проверьте Rules или повторную отправку.";

    } else {

      message.textContent =

        "Ошибка Firebase: " + (error.code || error.message || "Неизвестная ошибка");

    }

  } finally {

    button.disabled = false;

    button.textContent = "ОТПРАВИТЬ ГОЛОСА";

  }

};

// АДМИНИСТРАТОР

window.loginAdmin = async function() {

  const email = document.getElementById("adminEmail").value.trim();

  const message = document.getElementById("loginMessage");

  if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {

    message.textContent = "Нет доступа к админ-панели";

    return;

  }

  try {

    const settings = {

      url: window.location.origin + window.location.pathname,

      handleCodeInApp: true

    };

    await sendSignInLinkToEmail(auth,email,settings);

    localStorage.setItem("adminEmailForSignIn",email);

    message.textContent = "Ссылка отправлена на вашу почту!";

  } catch(error) {

    console.error(error);

    message.textContent =

      "Ошибка входа: " + (error.code || error.message);

  }

};

// ЗАВЕРШЕНИЕ ВХОДА

async function finishEmailLogin() {

  if (!isSignInWithEmailLink(auth,window.location.href)) return;

  let email = localStorage.getItem("adminEmailForSignIn");

  if (!email) {

    email = prompt("Введите почту администратора");

  }

  if (!email) return;

  try {

    await signInWithEmailLink(auth,email,window.location.href);

    localStorage.removeItem("adminEmailForSignIn");

    window.history.replaceState(

      {},

      document.title,

      window.location.pathname

    );

  } catch(error) {

    console.error(error);

    alert("Ошибка входа: " + (error.code || error.message));

  }

}

await finishEmailLogin();

// ПРОВЕРКА АДМИНИСТРАТОРА

onAuthStateChanged(auth,async user => {

  if (

    user &&

    user.email &&

    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()

  ) {

    adminUser = user;

    document.getElementById("loginBox").classList.add("hidden");

    document.getElementById("adminPanel").classList.remove("hidden");

    await loadResults();

  } else {

    adminUser = null;

    document.getElementById("loginBox").classList.remove("hidden");

    document.getElementById("adminPanel").classList.add("hidden");

  }

});

// РЕЗУЛЬТАТЫ

window.loadResults = async function() {

  if (!adminUser) return;

  const resultsBox = document.getElementById("results");

  const detailsBox = document.getElementById("details");

  resultsBox.textContent = "Загрузка...";

  detailsBox.innerHTML = "";

  try {

    await getRound();

    document.getElementById("roundInfo").textContent =

      "Текущий тур: " + currentRound;

    const snapshot = await getDocs(collection(db,"votes"));

    const totals = {};

    countries.forEach(country => totals[country] = 0);

    const votes = [];

    snapshot.forEach(item => {

      const data = item.data();

      if (data.round === currentRound) {

        votes.push(data);

      }

    });

    votes.sort((a,b) => {

      const t1 = a.createdAt?.toMillis?.() || 0;

      const t2 = b.createdAt?.toMillis?.() || 0;

      return t1 - t2;

    });

    votes.forEach(vote => {

      points.forEach(point => {

        const country = vote.scores?.[String(point)];

        if (country && totals[country] !== undefined) {

          totals[country] += point;

        }

      });

    });

    const ranking = Object.entries(totals)

      .sort((a,b) => b[1] - a[1]);

    resultsBox.innerHTML = "";

    ranking.forEach((item,index) => {

      const div = document.createElement("div");

      div.className = "result";

      div.textContent =

        (index + 1) + ". " + item[0] + " — " + item[1] + " баллов";

      resultsBox.appendChild(div);

    });

    detailsBox.innerHTML = "";

    if (votes.length === 0) {

      detailsBox.textContent = "Пока никто не проголосовал";

    }

    votes.forEach((vote,index) => {

      const div = document.createElement("div");

      div.className = "result";

      const title = document.createElement("strong");

      title.textContent = "Участник " + (index + 1);

      div.appendChild(title);

      points.forEach(point => {

        const line = document.createElement("p");

        line.textContent =

          point + " баллов — " +

          (vote.scores?.[String(point)] || "Нет данных");

        div.appendChild(line);

      });

      detailsBox.appendChild(div);

    });

  } catch(error) {

    console.error(error);

    resultsBox.textContent =

      "Ошибка загрузки: " + (error.code || error.message);

  }

};

// СБРОС ГОЛОСОВАНИЯ

window.resetVoting = async function() {

  if (!adminUser) return;

  const confirmed = confirm(

    "Вы уверены? Все сохранённые голоса будут удалены."

  );

  if (!confirmed) return;

  try {

    const snapshot = await getDocs(collection(db,"votes"));

    for (let i = 0; i < snapshot.docs.length; i += 400) {

      const batch = writeBatch(db);

      snapshot.docs.slice(i,i + 400).forEach(item => {

        batch.delete(item.ref);

      });

      await batch.commit();

    }

    currentRound++;

    await saveDoc(doc(db,"settings","voting"),{

      round: currentRound

    });

    await loadResults();

    alert("Голосование сброшено. Начался новый тур!");

  } catch(error) {

    console.error(error);

    alert("Ошибка сброса: " + (error.code || error.message));

  }

};

// ВЫХОД

window.logoutAdmin = async function() {

  await signOut(auth);

};

</script>

</body>

</html>
