

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eurovision FH Voting</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  padding: 20px;

  background: #090909;

  color: #f5f5f5;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 650px;

  margin: 30px auto;

  background: #151515;

  border: 1px solid #8e702f;

  border-radius: 16px;

  padding: 25px;

}

h1, h2 {

  text-align: center;

  color: #d8b65c;

}

.subtitle {

  text-align: center;

  color: #aaa;

  margin-bottom: 25px;

}

select, input {

  width: 100%;

  padding: 13px;

  margin: 8px 0;

  background: #222;

  color: white;

  border: 1px solid #555;

  border-radius: 8px;

  font-size: 15px;

}

button {

  width: 100%;

  padding: 13px;

  margin-top: 12px;

  background: #b18b3d;

  color: #111;

  border: none;

  border-radius: 8px;

  font-weight: bold;

  font-size: 15px;

  cursor: pointer;

}

button:hover {

  background: #d5b45e;

}

button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}

.country {

  margin: 15px 0;

  padding: 12px;

  background: #202020;

  border-radius: 9px;

}

.country label {

  display: block;

  margin-bottom: 5px;

  color: #d8b65c;

}

.message {

  text-align: center;

  margin-top: 15px;

  color: #d8b65c;

}

.hidden {

  display: none;

}

.result {

  background: #202020;

  padding: 12px;

  border-radius: 8px;

  margin: 8px 0;

}

.admin-box {

  border-top: 1px solid #555;

  margin-top: 25px;

  padding-top: 20px;

}

.small {

  color: #999;

  font-size: 13px;

  text-align: center;

}

.danger {

  background: #8e2929;

  color: white;

}

.secondary {

  background: #444;

  color: white;

}

.huge-number {

  color: #ccc;

  font-size: 11px;

  line-height: 1.6;

  word-break: break-all;

  overflow-wrap: anywhere;

  margin-top: 12px;

}

.huge-title {

  color: #d8b65c;

  font-weight: bold;

}

</style>

</head>

<body>

<div class="container">

<h1>EUROVISION FH</h1>

<p class="subtitle">Официальное голосование</p>

<div id="voting">

<h2>Голосование</h2>

<p class="small">

Распределите баллы между шестью разными странами

</p>

<div id="scoreFields"></div>

<button id="voteButton" onclick="submitVote()">

Отправить голоса

</button>

<p id="voteMessage" class="message"></p>

</div>

<div class="admin-box">

<h2>Администрация</h2>

<div id="loginBox">

<input id="adminEmail" type="email"

placeholder="Почта администратора">

<button onclick="loginAdmin()">

Войти в админ-панель

</button>

<p id="loginMessage" class="message"></p>

</div>

<div id="adminPanel" class="hidden">

<h2>Панель администратора</h2>

<p id="roundInfo" class="message"></p>

<button class="secondary" onclick="loadResults()">

Обновить результаты

</button>

<h2>Таблица результатов</h2>

<div id="results"></div>

<h2>Огромные числа стран</h2>

<p class="small">

Рейтинг отсортирован от самого большого числа к самому маленькому

</p>

<div id="hugeNumbers"></div>

<h2>Подробности голосования</h2>

<div id="details"></div>

<button class="danger" onclick="resetVoting()">

Сбросить голосование

</button>

<button class="secondary" onclick="logoutAdmin()">

Выйти из админ-панели

</button>

</div>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {

  getAuth,

  sendSignInLinkToEmail,

  isSignInWithEmailLink,

  signInWithEmailLink,

  signOut,

  onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {

  getFirestore,

  collection,

  addDoc,

  getDocs,

  doc,

  getDoc,

  setDoc,

  serverTimestamp,

  writeBatch

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyC8SKJZIDbNuo3nmZK_3bpUbWpCuWEa0Xg",

  authDomain: "eurovision-fh-voting-a8f25.firebaseapp.com",

  projectId: "eurovision-fh-voting-a8f25",

  storageBucket: "eurovision-fh-voting-a8f25.firebasestorage.app",

  messagingSenderId: "429725643873",

  appId: "1:429725643873:web:5305437fd2d799ccd06620",

  measurementId: "G-42HFQK5DH8"

};

const ADMIN_EMAIL = "micropus1@gmail.com";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

// СПИСОК СТРАН

const countries = [

  "𝙐𝙠𝙧𝙖𝙞𝙣𝙚🇺🇦",

  "𝙂𝙚𝙧𝙢𝙖𝙣𝙮🇩🇪",

  "𝙐𝙣𝙞𝙩𝙚𝙙 𝙆𝙞𝙣𝙜𝙙𝙤𝙢🇬🇧",

  "𝙈𝙖𝙡𝙩𝙖🇲🇹",

  "𝙁𝙧𝙖𝙣𝙘𝙚🇫🇷",

  "𝙎𝙥𝙖𝙞𝙣🇪🇸",

  "𝙄𝙩𝙖𝙡𝙮🇮🇹",

  "𝘽𝙪𝙡𝙜𝙖𝙧𝙞𝙖🇧🇬"

];

// ДЛИНА ОГРОМНЫХ ЧИСЕЛ

// Можно изменить на 5000 или 10000

const HUGE_NUMBER_DIGITS = 2000;

const HUGE_NUMBERS_KEY = "eurovisionHugeNumbersV1";

// Создание и сохранение огромных чисел

function generateHugeNumber() {

  const bytes = new Uint8Array(HUGE_NUMBER_DIGITS);

  crypto.getRandomValues(bytes);

  let number = "";

  for (let i = 0; i < bytes.length; i++) {

    let digit = bytes[i] % 10;

    if (i === 0) {

      digit = (digit % 9) + 1;

    }

    number += digit;

  }

  return number;

}

// Получение сохранённых чисел

function getHugeNumbers() {

  let saved = localStorage.getItem(HUGE_NUMBERS_KEY);

  if (saved) {

    try {

      const parsed = JSON.parse(saved);

      const valid = countries.every(country =>

        typeof parsed[country] === "string" &&

        parsed[country].length === HUGE_NUMBER_DIGITS

      );

      if (valid) return parsed;

    } catch (error) {

      console.error(error);

    }

  }

  const numbers = {};

  const usedNumbers = new Set();

  countries.forEach(country => {

    let number;

    do {

      number = generateHugeNumber();

    } while (usedNumbers.has(number));

    usedNumbers.add(number);

    numbers[country] = number;

  });

  localStorage.setItem(

    HUGE_NUMBERS_KEY,

    JSON.stringify(numbers)

  );

  return numbers;

}

// Отображение огромных чисел

function displayHugeNumbers() {

  const box = document.getElementById("hugeNumbers");

  box.innerHTML = "";

  const numbers = getHugeNumbers();

  const ranking = Object.entries(numbers).sort((a, b) => {

    if (a[1].length !== b[1].length) {

      return b[1].length - a[1].length;

    }

    if (a[1] > b[1]) return -1;

    if (a[1] < b[1]) return 1;

    return 0;

  });

  ranking.forEach((item, index) => {

    const div = document.createElement("div");

    div.className = "result";

    const title = document.createElement("div");

    title.className = "huge-title";

    title.textContent =

      (index + 1) + ". " + item[0];

    const number = document.createElement("div");

    number.className = "huge-number";

    number.textContent = item[1];

    div.appendChild(title);

    div.appendChild(number);

    box.appendChild(div);

  });

}

const points = [2, 4, 6, 8, 10, 12];

let currentRound = 1;

let adminUser = null;

// СОЗДАНИЕ ПОЛЕЙ ГОЛОСОВАНИЯ

function createScoreFields() {

  const container = document.getElementById("scoreFields");

  container.innerHTML = "";

  points.forEach(point => {

    const div = document.createElement("div");

    div.className = "country";

    const label = document.createElement("label");

    label.textContent = point + " баллов";

    const select = document.createElement("select");

    select.id = "score" + point;

    const placeholder = document.createElement("option");

    placeholder.value = "";

    placeholder.textContent = "Выберите страну";

    select.appendChild(placeholder);

    countries.forEach(country => {

      const option = document.createElement("option");

      option.value = country;

      option.textContent = country;

      select.appendChild(option);

    });

    div.appendChild(label);

    div.appendChild(select);

    container.appendChild(div);

  });

}

createScoreFields();

// ПОЛУЧЕНИЕ НОМЕРА ТУРА

async function getRound() {

  const ref = doc(db, "settings", "voting");

  const snapshot = await getDoc(ref);

  if (snapshot.exists()) {

    currentRound = snapshot.data().round || 1;

  } else {

    currentRound = 1;

  }

  return currentRound;

}

// ОТПРАВКА ГОЛОСОВ

window.submitVote = async function() {

  const message = document.getElementById("voteMessage");

  const button = document.getElementById("voteButton");

  try {

    await getRound();

    const votedRound = localStorage.getItem("eurovisionVotedRound");

    if (votedRound === String(currentRound)) {

      message.textContent = "Вы уже проголосовали в этом туре";

      return;

    }

    const scores = {};

    const selectedCountries = [];

    for (const point of points) {

      const country = document.getElementById("score" + point).value;

      if (!country) {

        message.textContent = "Пожалуйста, распределите все баллы";

        return;

      }

      if (selectedCountries.includes(country)) {

        message.textContent = "Нельзя выбирать одну страну несколько раз";

        return;

      }

      selectedCountries.push(country);

      scores[String(point)] = country;

    }

    button.disabled = true;

    button.textContent = "Отправка...";

    await addDoc(collection(db, "votes"), {

      scores: scores,

      createdAt: serverTimestamp()

    });

    localStorage.setItem(

      "eurovisionVotedRound",

      String(currentRound)

    );

    message.textContent = "Ваши голоса успешно отправлены!";

    points.forEach(point => {

      document.getElementById("score" + point).value = "";

    });

  } catch (error) {

    console.error(error);

    message.textContent = "Ошибка отправки. Попробуйте ещё раз.";

  } finally {

    button.disabled = false;

    button.textContent = "Отправить голоса";

  }

};

// ВХОД АДМИНИСТРАТОРА

window.loginAdmin = async function() {

  const email = document.getElementById("adminEmail").value.trim();

  const message = document.getElementById("loginMessage");

  if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {

    message.textContent = "Нет доступа к админ-панели";

    return;

  }

  try {

    const actionCodeSettings = {

      url: window.location.href.split("?")[0],

      handleCodeInApp: true

    };

    await sendSignInLinkToEmail(

      auth,

      email,

      actionCodeSettings

    );

    localStorage.setItem("adminEmailForSignIn", email);

    message.textContent =

      "Ссылка для входа отправлена на вашу почту";

  } catch (error) {

    console.error(error);

    message.textContent = "Ошибка отправки ссылки";

  }

};

// ЗАВЕРШЕНИЕ ВХОДА

async function finishEmailLogin() {

  if (isSignInWithEmailLink(auth, window.location.href)) {

    let email = localStorage.getItem("adminEmailForSignIn");

    if (!email) {

      email = prompt("Введите почту администратора");

    }

    if (!email) return;

    try {

      await signInWithEmailLink(

        auth,

        email,

        window.location.href

      );

      localStorage.removeItem("adminEmailForSignIn");

      window.history.replaceState(

        {},

        document.title,

        window.location.pathname

      );

    } catch (error) {

      console.error(error);

      alert("Не удалось выполнить вход. Проверьте почту.");

    }

  }

}

await finishEmailLogin();

// ПРОВЕРКА АДМИНИСТРАТОРА

onAuthStateChanged(auth, async user => {

  if (user && user.email === ADMIN_EMAIL) {

    adminUser = user;

    document.getElementById("loginBox").classList.add("hidden");

    document.getElementById("adminPanel").classList.remove("hidden");

    await loadResults();

  } else {

    adminUser = null;

    document.getElementById("loginBox").classList.remove("hidden");

    document.getElementById("adminPanel").classList.add("hidden");

  }

});

// ЗАГРУЗКА РЕЗУЛЬТАТОВ

window.loadResults = async function() {

  if (!adminUser) return;

  const resultsBox = document.getElementById("results");

  const detailsBox = document.getElementById("details");

  resultsBox.innerHTML = "Загрузка...";

  detailsBox.innerHTML = "";

  try {

    await getRound();

    // Показываем огромные числа только администратору

    displayHugeNumbers();

    document.getElementById("roundInfo").textContent =

      "Текущий тур: " + currentRound;

    const snapshot = await getDocs(collection(db, "votes"));

    const totals = {};

    countries.forEach(country => totals[country] = 0);

    const votes = [];

    snapshot.forEach(item => {

      votes.push(item.data());

    });

    votes.sort((a, b) => {

      const timeA = a.createdAt?.toMillis?.() || 0;

      const timeB = b.createdAt?.toMillis?.() || 0;

      return timeA - timeB;

    });

    votes.forEach(vote => {

      if (!vote.scores) return;

      points.forEach(point => {

        const country = vote.scores[String(point)];

        if (country && totals[country] !== undefined) {

          totals[country] += point;

        }

      });

    });

    const ranking = Object.entries(totals)

      .sort((a, b) => b[1] - a[1]);

    resultsBox.innerHTML = "";

    ranking.forEach((item, index) => {

      const div = document.createElement("div");

      div.className = "result";

      div.textContent =

        (index + 1) + ". " + item[0] + " — " + item[1] + " баллов";

      resultsBox.appendChild(div);

    });

    detailsBox.innerHTML = "";

    if (votes.length === 0) {

      detailsBox.textContent = "Пока никто не проголосовал";

    }

    votes.forEach((vote, index) => {

      const div = document.createElement("div");

      div.className = "result";

      const title = document.createElement("strong");

      title.textContent = "Участник " + (index + 1);

      div.appendChild(title);

      points.forEach(point => {

        const line = document.createElement("p");

        line.textContent =

          point + " баллов — " +

          (vote.scores?.[String(point)] || "Нет данных");

        div.appendChild(line);

      });

      detailsBox.appendChild(div);

    });

  } catch (error) {

    console.error(error);

    resultsBox.textContent = "Ошибка загрузки результатов";

  }

};

// СБРОС ГОЛОСОВАНИЯ

window.resetVoting = async function() {

  if (!adminUser) return;

  const confirmed = confirm(

    "Вы уверены? Все голоса текущего тура будут удалены."

  );

  if (!confirmed) return;

  try {

    const snapshot = await getDocs(collection(db, "votes"));

    const documents = snapshot.docs;

    for (let i = 0; i < documents.length; i += 400) {

      const batch = writeBatch(db);

      documents.slice(i, i + 400).forEach(item => {

        batch.delete(item.ref);

      });

      await batch.commit();

    }

    currentRound++;

    await setDoc(doc(db, "settings", "voting"), {

      round: currentRound

    });

    await loadResults();

    alert("Голосование сброшено. Начался новый тур.");

  } catch (error) {

    console.error(error);

    alert("Не удалось сбросить голосование");

  }

};

// ВЫХОД

window.logoutAdmin = async function() {

  await signOut(auth);

};

</script>

</body>

</html>
