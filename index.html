

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eurovision FH Voting</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0; padding: 25px 15px;

  background: #090909; color: white;

  font-family: Arial, sans-serif;

}

.container { max-width: 650px; margin: auto; text-align: center; }

h1 { color: #d8b45b; font-size: 28px; }

.subtitle { color: #aaa; }

.card {

  background: #171717; border: 1px solid #5b4822;

  border-radius: 12px; padding: 18px;

  margin: 15px 0; text-align: left;

}

label { display: block; margin-bottom: 9px; }

select, input {

  width: 100%; padding: 12px; border-radius: 7px;

  background: #252525; color: white;

  border: 1px solid #8b7139; margin-bottom: 15px;

}

button {

  width: 100%; padding: 13px; margin: 7px 0;

  background: #c5a04b; color: #090909;

  border: none; border-radius: 7px;

  font-weight: bold; font-size: 16px; cursor: pointer;

}

.secondary { background: #333; color: white; }

#message { color: #d8b45b; margin-top: 18px; }

.hidden { display: none; }

.result { border-bottom: 1px solid #444; padding: 10px 0; }

</style>

</head>

<body>

<div class="container">

  <h1>EUROVISION FH VOTING</h1>

  <p class="subtitle">Official Voting</p>

  <section id="votingSection">

    <div class="card">

      <label for="country">Выбери свою страну:</label>

      <select id="country"></select>

    </div>

    <div id="votes"></div>

    <button id="submitButton">Отправить голоса</button>

    <p id="message"></p>

  </section>

  <button class="secondary" id="adminButton">Admin</button>

  <section id="adminSection" class="hidden">

    <div class="card">

      <h2>Вход администратора</h2>

      <input id="adminEmail" type="email" placeholder="Email администратора">

      <input id="adminPassword" type="password" placeholder="Пароль">

      <button id="loginButton">Войти</button>

      <p id="adminMessage"></p>

    </div>

  </section>

  <section id="resultsSection" class="hidden">

    <h2>Админ-панель</h2>

    <button class="secondary" id="refreshButton">Обновить результаты</button>

    <button class="secondary" id="logoutButton">Выйти</button>

    <h3>Общий рейтинг</h3>

    <div id="ranking"></div>

    <h3>Голоса участников</h3>

    <div id="details"></div>

  </section>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {

  getFirestore, doc, setDoc, getDocs,

  collection, serverTimestamp

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

import {

  getAuth, signInWithEmailAndPassword,

  onAuthStateChanged, signOut

} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyDGQotVzDyHmOqY9b8K_tWU8F4T1vsQnoc",

  authDomain: "eurovision-fh-voting.firebaseapp.com",

  projectId: "eurovision-fh-voting",

  storageBucket: "eurovision-fh-voting.firebasestorage.app",

  messagingSenderId: "28671234305",

  appId: "1:28671234305:web:4ec6cbb4e69f11abaf8b00",

  measurementId: "G-KTMLQ85DZQ"

};

const ADMIN_UID = "jblzGfwiuWbIV3Kn8a1FK3dlups1";

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

const countries = [

  "🇩🇪 Германия", "🇭🇷 Хорватия", "🇮🇹 Италия",

  "🇦🇱 Албания", "🇲🇹 Мальта", "🇫🇷 Франция",

  "🇸🇰 Словакия", "🇷🇺 Россия", "🇧🇾 Беларусь",

  "🇺🇦 Украина", "🇸🇪 Швеция", "🇸🇲 Сан-Марино",

  "🇪🇸 Испания", "🇵🇱 Польша"

];

const points = [1,2,3,4,5,6,7,8,10,12];

const countrySelect = document.getElementById("country");

const votesDiv = document.getElementById("votes");

countries.forEach((c, i) => countrySelect.add(new Option(c, c)));

points.forEach(point => {

  const card = document.createElement("div");

  card.className = "card";

  const label = document.createElement("label");

  label.textContent = point + " баллов";

  const select = document.createElement("select");

  select.className = "vote";

  select.add(new Option("Выбери страну", ""));

  countries.forEach(c => select.add(new Option(c, c)));

  card.append(label, select);

  votesDiv.append(card);

});

let voterId = localStorage.getItem("eurovisionVoterId");

if (!voterId) {

  voterId = crypto.randomUUID();

  localStorage.setItem("eurovisionVoterId", voterId);

}

document.getElementById("submitButton").addEventListener("click", async () => {

  const message = document.getElementById("message");

  const voterCountry = countrySelect.value;

  const selects = [...document.querySelectorAll(".vote")];

  const chosen = selects.map(s => s.value);

  if (localStorage.getItem("eurovisionVoted")) {

    message.textContent = "Ты уже голосовал с этого браузера!";

    return;

  }

  if (chosen.some(v => !v)) {

    message.textContent = "Заполни все баллы!";

    return;

  }

  if (chosen.includes(voterCountry)) {

    message.textContent = "Нельзя голосовать за свою страну!";

    return;

  }

  if (new Set(chosen).size !== chosen.length) {

    message.textContent = "Нельзя отдавать несколько баллов одной стране!";

    return;

  }

  const scores = {};

  points.forEach((p, i) => scores[String(p)] = chosen[i]);

  try {

    await setDoc(doc(db, "votes", voterId), {

      voterCountry,

      scores,

      createdAt: serverTimestamp()

    });

    localStorage.setItem("eurovisionVoted", "true");

    message.textContent = "Голоса приняты! Спасибо за участие.";

    document.getElementById("submitButton").disabled = true;

  } catch (error) {

    message.textContent = "Не удалось отправить голоса. Возможно, ты уже голосовал.";

    console.error(error);

  }

});

document.getElementById("adminButton").addEventListener("click", () => {

  document.getElementById("adminSection").classList.toggle("hidden");

});

document.getElementById("loginButton").addEventListener("click", async () => {

  const email = document.getElementById("adminEmail").value;

  const password = document.getElementById("adminPassword").value;

  const message = document.getElementById("adminMessage");

  try {

    const result = await signInWithEmailAndPassword(auth, email, password);

    if (result.user.uid !== ADMIN_UID) {

      await signOut(auth);

      message.textContent = "Нет доступа к админ-панели.";

      return;

    }

    message.textContent = "Вход выполнен!";

  } catch (error) {

    message.textContent = "Ошибка входа. Проверь email и пароль.";

  }

});

onAuthStateChanged(auth, user => {

  const isAdmin = user && user.uid === ADMIN_UID;

  document.getElementById("resultsSection").classList.toggle("hidden", !isAdmin);

  if (isAdmin) loadResults();

});

async function loadResults() {

  const ranking = document.getElementById("ranking");

  const details = document.getElementById("details");

  ranking.textContent = "Загрузка...";

  details.textContent = "";

  try {

    const snapshot = await getDocs(collection(db, "votes"));

    const totals = Object.fromEntries(countries.map(c => [c, 0]));

    details.innerHTML = "";

    snapshot.forEach(item => {

      const vote = item.data();

      const card = document.createElement("div");

      card.className = "card";

      const heading = document.createElement("strong");

      heading.textContent = "Страна участника: " + vote.voterCountry;

      card.append(heading);

      points.forEach(p => {

        const country = vote.scores[String(p)];

        if (totals[country] !== undefined) totals[country] += p;

        const line = document.createElement("div");

        line.className = "result";

        line.textContent = p + " баллов — " + country;

        card.append(line);

      });

      details.append(card);

    });

    ranking.innerHTML = "";

    Object.entries(totals)

      .sort((a,b) => b[1] - a[1])

      .forEach(([country, total], index) => {

        const line = document.createElement("div");

        line.className = "result";

        line.textContent = (index + 1) + ". " + country + " — " + total + " баллов";

        ranking.append(line);

      });

    if (snapshot.empty) details.textContent = "Пока нет голосов.";

  } catch (error) {

    ranking.textContent = "Не удалось загрузить результаты.";

    console.error(error);

  }

}

document.getElementById("refreshButton").addEventListener("click", loadResults);

document.getElementById("logoutButton").addEventListener("click", () => signOut(auth));

</script>

</body>

</html>
