

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eurovision FH Voting</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 25px 15px;

  background: #090909;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 650px;

  margin: auto;

  text-align: center;

}

h1 { color: #d8b45b; font-size: 28px; }

.subtitle { color: #aaa; }

.card {

  background: #171717;

  border: 1px solid #5b4822;

  border-radius: 12px;

  padding: 18px;

  margin: 15px 0;

  text-align: left;

}

label {

  display: block;

  margin-bottom: 9px;

}

select, input {

  width: 100%;

  padding: 12px;

  border-radius: 7px;

  background: #252525;

  color: white;

  border: 1px solid #8b7139;

  margin-bottom: 15px;

}

button {

  width: 100%;

  padding: 13px;

  margin: 7px 0;

  background: #c5a04b;

  color: #090909;

  border: none;

  border-radius: 7px;

  font-weight: bold;

  font-size: 16px;

  cursor: pointer;

}

button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}

.secondary {

  background: #333;

  color: white;

}

.danger {

  background: #9b3030;

  color: white;

}

#message, #adminMessage {

  color: #d8b45b;

  margin-top: 18px;

}

.hidden { display: none; }

.result {

  border-bottom: 1px solid #444;

  padding: 10px 0;

}

</style>

</head>

<body>

<div class="container">

  <h1>EUROVISION FH VOTING</h1>

  <p class="subtitle">Official Voting</p>

  <section id="votingSection">

    <div class="card">

      <label for="country">Выбери свою страну:</label>

      <select id="country"></select>

    </div>

    <div id="votes"></div>

    <button id="submitButton" disabled>Загрузка...</button>

    <p id="message"></p>

  </section>

  <button class="secondary" id="adminButton">Admin</button>

  <section id="adminSection" class="hidden">

    <div class="card">

      <h2>Вход администратора</h2>

      <p>Введи свою почту, чтобы получить ссылку для входа.</p>

      <input id="adminEmail" type="email"

        placeholder="Email администратора">

      <button id="loginButton">Получить ссылку на почту</button>

      <p id="adminMessage"></p>

    </div>

  </section>

  <section id="resultsSection" class="hidden">

    <h2>Админ-панель</h2>

    <p id="roundInfo"></p>

    <button class="secondary" id="refreshButton">

      Обновить результаты

    </button>

    <button class="danger" id="resetButton">

      Обнулить голосование

    </button>

    <button class="secondary" id="logoutButton">

      Выйти

    </button>

    <h3>Общий рейтинг</h3>

    <div id="ranking"></div>

    <h3>Голоса участников</h3>

    <div id="details"></div>

  </section>

</div>

<script type="module">

import { initializeApp } from

"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {

  getFirestore,

  doc,

  setDoc,

  getDoc,

  getDocs,

  collection,

  serverTimestamp,

  writeBatch

} from

"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

import {

  getAuth,

  sendSignInLinkToEmail,

  isSignInWithEmailLink,

  signInWithEmailLink,

  onAuthStateChanged,

  signOut

} from

"https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyC8SKJZIDbNuo3nmZK_3bpUbWpCuWEa0Xg",

  authDomain: "eurovision-fh-voting-a8f25.firebaseapp.com",

  projectId: "eurovision-fh-voting-a8f25",

  storageBucket: "eurovision-fh-voting-a8f25.firebasestorage.app",

  messagingSenderId: "429725643873",

  appId: "1:429725643873:web:5305437fd2d799ccd06620",

  measurementId: "G-42HFQK5DH8"

};

const ADMIN_EMAIL = "micropus1@gmail.com";

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

let currentRound = 1;

let roundReady = false;

/* СТРАНЫ И БАЛЛЫ */

const countries = [

  "🇩🇪 Германия",

  "🇭🇷 Хорватия",

  "🇮🇹 Италия",

  "🇦🇱 Албания",

  "🇲🇹 Мальта",

  "🇫🇷 Франция",

  "🇸🇰 Словакия",

  "🇷🇺 Россия",

  "🇧🇾 Беларусь",

  "🇺🇦 Украина",

  "🇸🇪 Швеция",

  "🇸🇲 Сан-Марино",

  "🇪🇸 Испания",

  "🇵🇱 Польша"

];

const points = [1,2,3,4,5,6,7,8,10,12];

const countrySelect = document.getElementById("country");

const votesDiv = document.getElementById("votes");

const submitButton = document.getElementById("submitButton");

countries.forEach(c => {

  countrySelect.add(new Option(c, c));

});

points.forEach(point => {

  const card = document.createElement("div");

  card.className = "card";

  const label = document.createElement("label");

  label.textContent = point + " баллов";

  const select = document.createElement("select");

  select.className = "vote";

  select.add(new Option("Выбери страну", ""));

  countries.forEach(c => {

    select.add(new Option(c, c));

  });

  card.append(label, select);

  votesDiv.append(card);

});

/* ID УЧАСТНИКА */

let voterId = localStorage.getItem("eurovisionVoterId");

if (!voterId) {

  voterId = crypto.randomUUID();

  localStorage.setItem("eurovisionVoterId", voterId);

}

/* ЗАГРУЗКА НОМЕРА РАУНДА */

async function loadVotingRound() {

  try {

    const setting = await getDoc(doc(db, "settings", "voting"));

    if (setting.exists()) {

      currentRound = setting.data().round || 1;

    } else {

      currentRound = 1;

    }

    roundReady = true;

    submitButton.disabled = false;

    submitButton.textContent = "Отправить голоса";

    if (

      localStorage.getItem("eurovisionVotedRound") ===

      String(currentRound)

    ) {

      submitButton.disabled = true;

      document.getElementById("message").textContent =

        "Ты уже голосовал в этом раунде!";

    }

  } catch (error) {

    console.error(error);

    document.getElementById("message").textContent =

      "Не удалось загрузить настройки голосования.";

  }

}

loadVotingRound();

/* ГОЛОСОВАНИЕ */

submitButton.addEventListener("click", async () => {

  const message = document.getElementById("message");

  if (!roundReady) {

    message.textContent = "Подожди загрузки голосования.";

    return;

  }

  if (

    localStorage.getItem("eurovisionVotedRound") ===

    String(currentRound)

  ) {

    message.textContent = "Ты уже голосовал в этом раунде!";

    return;

  }

  const voterCountry = countrySelect.value;

  const selects = [...document.querySelectorAll(".vote")];

  const chosen = selects.map(s => s.value);

  if (chosen.some(v => !v)) {

    message.textContent = "Заполни все баллы!";

    return;

  }

  if (chosen.includes(voterCountry)) {

    message.textContent = "Нельзя голосовать за свою страну!";

    return;

  }

  if (new Set(chosen).size !== chosen.length) {

    message.textContent =

      "Нельзя отдавать несколько баллов одной стране!";

    return;

  }

  const scores = {};

  points.forEach((p, i) => {

    scores[String(p)] = chosen[i];

  });

  submitButton.disabled = true;

  try {

    await setDoc(doc(db, "votes", voterId), {

      voterCountry,

      scores,

      createdAt: serverTimestamp()

    });

    localStorage.setItem(

      "eurovisionVotedRound",

      String(currentRound)

    );

    message.textContent =

      "Голоса приняты! Спасибо за участие.";

  } catch (error) {

    console.error(error);

    message.textContent =

      "Не удалось отправить голоса. Попробуй ещё раз.";

    submitButton.disabled = false;

  }

});

/* КНОПКА ADMIN */

document.getElementById("adminButton")

.addEventListener("click", () => {

  document.getElementById("adminSection")

    .classList.toggle("hidden");

});

/* ВХОД ПО ССЫЛКЕ */

const actionCodeSettings = {

  url: "https://micropus1-lab.github.io/Evrovision-fh-Voting/",

  handleCodeInApp: true

};

document.getElementById("loginButton")

.addEventListener("click", async () => {

  const email = document.getElementById("adminEmail")

    .value.trim().toLowerCase();

  const message = document.getElementById("adminMessage");

  if (!email) {

    message.textContent = "Введи свою электронную почту.";

    return;

  }

  if (email !== ADMIN_EMAIL.toLowerCase()) {

    message.textContent = "Нет доступа к админ-панели.";

    return;

  }

  try {

    await sendSignInLinkToEmail(auth, email, actionCodeSettings);

    localStorage.setItem("emailForSignIn", email);

    message.textContent =

      "Ссылка отправлена! Проверь свою почту.";

  } catch (error) {

    console.error(error);

    message.textContent =

      "Не удалось отправить письмо. Проверь настройки Firebase.";

  }

});

/* ПОДТВЕРЖДЕНИЕ ВХОДА */

async function completeEmailSignIn() {

  if (!isSignInWithEmailLink(auth, window.location.href)) {

    return;

  }

  let email = localStorage.getItem("emailForSignIn");

  if (!email) {

    email = window.prompt(

      "Введи почту, на которую пришла ссылка:"

    );

  }

  if (!email) return;

  try {

    const result = await signInWithEmailLink(

      auth,

      email,

      window.location.href

    );

    localStorage.removeItem("emailForSignIn");

    window.history.replaceState(

      {},

      document.title,

      window.location.pathname

    );

    if (

      !result.user.email ||

      result.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()

    ) {

      await signOut(auth);

      alert("Нет доступа к админ-панели.");

    }

  } catch (error) {

    console.error(error);

    alert("Не удалось подтвердить вход. Запроси новую ссылку.");

  }

}

completeEmailSignIn();

/* ПРОВЕРКА АДМИНИСТРАТОРА */

function isAdminUser(user) {

  return user &&

    user.email &&

    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

}

onAuthStateChanged(auth, async user => {

  const admin = isAdminUser(user);

  document.getElementById("resultsSection")

    .classList.toggle("hidden", !admin);

  if (admin) {

    try {

      const settingRef = doc(db, "settings", "voting");

      const setting = await getDoc(settingRef);

      if (!setting.exists()) {

        await setDoc(settingRef, { round: 1 });

        currentRound = 1;

      } else {

        currentRound = setting.data().round || 1;

      }

      roundReady = true;

      await loadResults();

    } catch (error) {

      console.error(error);

      document.getElementById("ranking").textContent =

        "Не удалось загрузить настройки.";

    }

  }

});

/* ЗАГРУЗКА РЕЗУЛЬТАТОВ */

async function loadResults() {

  const ranking = document.getElementById("ranking");

  const details = document.getElementById("details");

  ranking.textContent = "Загрузка...";

  details.textContent = "";

  try {

    const snapshot = await getDocs(collection(db, "votes"));

    const totals = Object.fromEntries(

      countries.map(c => [c, 0])

    );

    details.innerHTML = "";

    snapshot.forEach(item => {

      const vote = item.data();

      const card = document.createElement("div");

      card.className = "card";

      const heading = document.createElement("strong");

      heading.textContent =

        "Страна участника: " + vote.voterCountry;

      card.append(heading);

      points.forEach(p => {

        const country = vote.scores[String(p)];

        if (totals[country] !== undefined) {

          totals[country] += p;

        }

        const line = document.createElement("div");

        line.className = "result";

        line.textContent = p + " баллов — " + country;

        card.append(line);

      });

      details.append(card);

    });

    ranking.innerHTML = "";

    Object.entries(totals)

      .sort((a,b) => b[1] - a[1])

      .forEach(([country, total], index) => {

        const line = document.createElement("div");

        line.className = "result";

        line.textContent =

          (index + 1) + ". " + country + " — " + total + " баллов";

        ranking.append(line);

      });

    document.getElementById("roundInfo").textContent =

      "Текущий раунд: " + currentRound;

    if (snapshot.empty) {

      details.textContent = "Пока нет голосов.";

    }

  } catch (error) {

    ranking.textContent = "Не удалось загрузить результаты.";

    console.error(error);

  }

}

/* ОБНУЛЕНИЕ ГОЛОСОВАНИЯ */

document.getElementById("resetButton")

.addEventListener("click", async () => {

  if (!isAdminUser(auth.currentUser)) {

    alert("Нет доступа.");

    return;

  }

  const confirmed = confirm(

    "Ты действительно хочешь удалить ВСЕ голоса и начать новый раунд? Это действие нельзя отменить."

  );

  if (!confirmed) return;

  const button = document.getElementById("resetButton");

  button.disabled = true;

  button.textContent = "Удаление...";

  try {

    const snapshot = await getDocs(collection(db, "votes"));

    const documents = snapshot.docs;

    for (let i = 0; i < documents.length; i += 400) {

      const batch = writeBatch(db);

      documents.slice(i, i + 400).forEach(item => {

        batch.delete(item.ref);

      });

      await batch.commit();

    }

    currentRound += 1;

    await setDoc(doc(db, "settings", "voting"), {

      round: currentRound

    });

    document.getElementById("roundInfo").textContent =

      "Текущий раунд: " + currentRound;

    alert("Голосование обнулено! Начался новый раунд.");

    await loadResults();

  } catch (error) {

    console.error(error);

    alert(

      "Не удалось полностью обнулить голосование. Проверь подключение и правила Firebase."

    );

  }

  button.disabled = false;

  button.textContent = "Обнулить голосование";

});

/* ОСТАЛЬНЫЕ КНОПКИ */

document.getElementById("refreshButton")

.addEventListener("click", loadResults);

document.getElementById("logoutButton")

.addEventListener("click", () => signOut(auth));

</script>

</body>

</html>
