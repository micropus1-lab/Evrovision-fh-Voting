

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EUROVISION FH VOTING</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  background: #050505;

  color: white;

  font-family: Arial, sans-serif;

}

header {

  text-align: center;

  padding: 45px 15px;

  background: linear-gradient(135deg, #202020, #080808);

  border-bottom: 1px solid #444;

}

header h1 {

  font-size: 30px;

  letter-spacing: 4px;

  margin: 0;

}

header p {

  color: #c5a34b;

  letter-spacing: 3px;

}

main {

  max-width: 650px;

  margin: 30px auto;

  padding: 15px;

}

.card {

  background: #151515;

  border: 1px solid #383838;

  border-radius: 14px;

  padding: 22px;

  margin-bottom: 22px;

}

h2 {

  color: #d5b65d;

  font-size: 21px;

}

label {

  display: block;

  margin: 17px 0 8px;

  color: #ccc;

}

select {

  width: 100%;

  padding: 14px;

  background: #252525;

  color: white;

  border: 1px solid #555;

  border-radius: 8px;

  font-size: 16px;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 22px;

  background: #d5b65d;

  color: black;

  border: none;

  border-radius: 8px;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

}

table {

  width: 100%;

  border-collapse: collapse;

}

td, th {

  padding: 13px 5px;

  border-bottom: 1px solid #383838;

  text-align: left;

}

th { color: #d5b65d; }

.points {

  color: #d5b65d;

  text-align: right;

  font-weight: bold;

}

footer {

  text-align: center;

  color: #777;

  padding: 25px;

}

</style>

</head>

<body>

<header>

  <h1>EUROVISION</h1>

  <p>FH VOTING 2026</p>

</header>

<main>

<div class="card">

  <h2>Голосование</h2>

  <label>Страна, которая голосует</label>

  <select id="voter"></select>

  <label>Страна, которой выставляются баллы</label>

  <select id="country"></select>

  <label>Количество баллов</label>

  <select id="points">

    <option value="1">1 балл</option>

    <option value="2">2 балла</option>

    <option value="3">3 балла</option>

    <option value="4">4 балла</option>

    <option value="5">5 баллов</option>

    <option value="6">6 баллов</option>

    <option value="7">7 баллов</option>

    <option value="8">8 баллов</option>

    <option value="10">10 баллов</option>

    <option value="12">12 баллов</option>

  </select>

  <button onclick="addVote()">ВЫСТАВИТЬ БАЛЛЫ</button>

  <p id="message"></p>

</div>

<div class="card">

  <h2>Таблица результатов</h2>

  <table>

    <thead>

      <tr>

        <th>Страна</th>

        <th style="text-align:right">Баллы</th>

      </tr>

    </thead>

    <tbody id="results"></tbody>

  </table>

</div>

</main>

<footer>

  EUROVISION FH VOTING © 2026

</footer>

<script>

const countries = [

  "Germany 🇩🇪",

  "Croatia 🇭🇷",

  "Italy 🇮🇹",

  "Albania 🇦🇱",

  "Malta 🇲🇹",

  "France 🇫🇷",

  "Slovakia 🇸🇰",

  "Russia 🇷🇺",

  "Belarus 🇧🇾",

  "Ukraine 🇺🇦",

  "Sweden 🇸🇪",

  "San Marino 🇸🇲",

  "Spain 🇪🇸",

  "Poland 🇵🇱"

];

let scores = {};

countries.forEach(c => scores[c] = 0);

function fillSelects() {

  document.getElementById("voter").innerHTML =

    countries.map(c => `<option>${c}</option>`).join("");

  document.getElementById("country").innerHTML =

    countries.map(c => `<option>${c}</option>`).join("");

}

function addVote() {

  const voter = document.getElementById("voter").value;

  const country = document.getElementById("country").value;

  const points = Number(document.getElementById("points").value);

  const message = document.getElementById("message");

  if (voter === country) {

    message.textContent = "Нельзя голосовать за свою страну!";

    return;

  }

  scores[country] += points;

  message.textContent = "Баллы успешно выставлены!";

  renderResults();

}

function renderResults() {

  const sorted = [...countries].sort(

    (a, b) => scores[b] - scores[a]

  );

  document.getElementById("results").innerHTML =

    sorted.map(c => `

      <tr>

        <td>${c}</td>

        <td class="points">${scores[c]}</td>

      </tr>

    `).join("");

}

fillSelects();

renderResults();

</script>

</body>

</html>
