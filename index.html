

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eurovision FH Voting</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 25px 15px;

  background: #090909;

  color: white;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 650px;

  margin: auto;

  text-align: center;

}

h1 {

  color: #d8b45b;

  font-size: 30px;

}

.subtitle { color: #aaa; }

.card {

  background: #171717;

  border: 1px solid #5b4822;

  border-radius: 12px;

  padding: 18px;

  margin: 15px 0;

  text-align: left;

}

label { display: block; margin-bottom: 9px; }

select {

  width: 100%;

  padding: 12px;

  border-radius: 7px;

  background: #252525;

  color: white;

  border: 1px solid #8b7139;

  margin-bottom: 15px;

}

button {

  width: 100%;

  padding: 13px;

  background: #c5a04b;

  color: #090909;

  border: none;

  border-radius: 7px;

  font-weight: bold;

  font-size: 16px;

  cursor: pointer;

}

#message {

  text-align: center;

  margin-top: 18px;

  color: #d8b45b;

}

</style>

</head>

<body>

<div class="container">

  <h1>EUROVISION FH VOTING</h1>

  <p class="subtitle">Official Voting</p>

  <div class="card">

    <label for="country">Выбери свою страну:</label>

    <select id="country"></select>

  </div>

  <div id="votes"></div>

  <button onclick="submitVotes()">Отправить голоса</button>

  <p id="message"></p>

</div>

<script>

const countries = [

  "🇩🇪 Германия",

  "🇭🇷 Хорватия",

  "🇮🇹 Италия",

  "🇦🇱 Албания",

  "🇲🇹 Мальта",

  "🇫🇷 Франция",

  "🇸🇰 Словакия",

  "🇷🇺 Россия",

  "🇧🇾 Беларусь",

  "🇺🇦 Украина",

  "🇸🇪 Швеция",

  "🇸🇲 Сан-Марино",

  "🇪🇸 Испания",

  "🇵🇱 Польша"

];

const points = [1,2,3,4,5,6,7,8,10,12];

const countrySelect = document.getElementById("country");

const votesDiv = document.getElementById("votes");

countries.forEach((country, i) => {

  countrySelect.add(new Option(country, i));

});

function createVoting() {

  votesDiv.innerHTML = "";

  points.forEach(point => {

    const card = document.createElement("div");

    card.className = "card";

    const label = document.createElement("label");

    label.textContent = point + " баллов";

    const select = document.createElement("select");

    select.className = "vote";

    select.add(new Option("Выбери страну", ""));

    countries.forEach((country, i) => {

      select.add(new Option(country, i));

    });

    card.append(label, select);

    votesDiv.append(card);

  });

}

function submitVotes() {

  const voter = countrySelect.value;

  const selects = [...document.querySelectorAll(".vote")];

  const chosen = selects.map(s => s.value);

  if (chosen.some(v => v === "")) {

    document.getElementById("message").textContent =

      "Заполни все баллы!";

    return;

  }

  if (chosen.includes(voter)) {

    document.getElementById("message").textContent =

      "Нельзя голосовать за свою страну!";

    return;

  }

  if (new Set(chosen).size !== chosen.length) {

    document.getElementById("message").textContent =

      "Нельзя отдавать несколько баллов одной стране!";

    return;

  }

  document.getElementById("message").textContent =

    "Голоса приняты! Спасибо за участие.";

}

createVoting();

</script>

</body>
